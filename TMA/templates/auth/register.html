{% extends "base.html" %}
{% block title %}Register - TrekOS{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2>Create Account</h2>
    <form method="POST" action="/register">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>I am a...</label>
            <select name="role" id="role-select" class="form-control" onchange="toggleStaffFields()">
                <option value="user">Trekker (Standard User)</option>
                <option value="staff">Guide / Staff Member</option>
            </select>
        </div>

        <div id="staff-fields" style="display: none; background: #f9f9f9; padding: 10px; border-left: 3px solid #1abc9c; margin-bottom: 15px;">
            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" name="contact_number" class="form-control">
            </div>
            <div class="form-group">
                <label>Experience (Years/Details)</label>
                <textarea name="experience" class="form-control" rows="3"></textarea>
            </div>
        </div>
             
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>

<script>
function toggleStaffFields() {
    var role = document.getElementById('role-select').value;
    var staffFields = document.getElementById('staff-fields');
    if (role === 'staff') {
        staffFields.style.display = 'block';
    } else {
        staffFields.style.display = 'none';
    }
}
</script>
{% endblock %}
